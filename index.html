<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

const SUPABASE_URL = "https://xixsokdzqqvqxfwpdche.supabase.co";
const SUPABASE_KEY = "sb_publishable_HW3lE4vpyklziTuUaCHdWQ_OnGHKkYt";
const TABLE_ANNONCES = "annonces";

let db = null;

if (window.supabase && typeof window.supabase.createClient === "function") {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  console.log("Supabase connecté ✅");
} else {
  console.error("Supabase n'est pas chargé ❌");
}

function byId(id) {
  return document.getElementById(id);
}

function openModal(id) {
  const modal = byId(id);
  if (!modal) {
    console.error("Modal introuvable :", id);
    return;
  }
  modal.classList.add("open");
}

function closeModal(id) {
  const modal = byId(id);
  if (!modal) {
    console.error("Modal introuvable :", id);
    return;
  }
  modal.classList.remove("open");
}

function showToast(message) {
  const toast = byId("toast");
  if (!toast) {
    console.log(message);
    return;
  }
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>'"]/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "'": "&#39;",
      '"': "&quot;"
    }[char];
  });
}

const seedAds = [
  {
    id: 1,
    img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80",
    region: "Vendée",
    lieu: "Les Sables-d’Olonne",
    pseudo: "JulieSoleil",
    aff: "95%",
    desc: "Semaine simple et joyeuse : plage, balades, repas partagés et enfants qui se font des copains.",
    adults: "1 adulte déjà inscrit",
    kids: "2 enfants : 7 et 10 ans",
    places: "1 adulte + 1 à 2 enfants",
    price: "450 €",
    dates: "10 - 17 août",
    link: "https://www.exemple-location-vendee.fr",
    home: "Maison 3 chambres, 4 lits, jardin clos."
  },
  {
    id: 2,
    img: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80",
    region: "Côte d'Azur",
    lieu: "Fréjus et environ",
    pseudo: "CamilleFamily",
    aff: "89%",
    desc: "Séjour détente avec piscine, plage et sorties enfants. Ambiance bienveillante et organisée.",
    adults: "1 adulte déjà inscrit",
    kids: "1 enfant : 8 ans",
    places: "1 adulte + 1 enfant",
    price: "520 €",
    dates: "1 - 15 juillet",
    link: "Non renseigné",
    home: "Appartement proche plage, canapé-lit disponible."
  },
  {
    id: 3,
    img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80",
    region: "Annecy et environ",
    lieu: "Lac d’Annecy",
    pseudo: "NinaMontagne",
    aff: "84%",
    desc: "Vacances nature : baignade, pique-nique et petites randonnées accessibles aux enfants.",
    adults: "1 adulte déjà inscrit",
    kids: "2 enfants : 6 et 12 ans",
    places: "1 adulte + 2 enfants max",
    price: "390 €",
    dates: "20 - 27 juillet",
    link: "https://www.exemple-chalet-annecy.fr",
    home: "Chalet familial, chambres séparées, terrasse."
  }
];

const ads = [...seedAds];
let selected = null;

function normalizeAnnonce(row, index = 0) {
  const prix = row.prix ?? row.price ?? "";
  const prixAffiche = prix === null || prix === "" ? "À discuter" : `${prix} €`.replace("€ €", "€");

  return {
    id: row.id ?? Date.now() + index,
    img: row.img || row.image || "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80",
    region: row.region || "Destination à préciser",
    lieu: row.lieu || row.region || "Séjour proposé",
    pseudo: row.pseudo || "Parent solo",
    aff: row.aff || "Nouveau",
    desc: row.description || row.desc || "Annonce publiée depuis le site Co-Vacances.",
    adults: row.participants || row.adults || "À préciser",
    kids: row.enfants || row.kids || "À préciser",
    places: row.places || "À discuter",
    price: prixAffiche,
    dates: row.dates || "Dates à préciser",
    link: row.lien || row.link || "Non renseigné",
    home: row.hebergement || row.home || row.description || "Conditions à préciser"
  };
}

function renderAds() {
  const grid = byId("adsGrid");
  if (!grid) return;

  grid.innerHTML = ads.map(function(a) {
    return `
      <article class="ad" onclick="openDetail(${a.id})">
        <div class="ad-img">
          <img src="${escapeHTML(a.img)}" alt="${escapeHTML(a.region)}">
          <span class="aff">💕 ${escapeHTML(a.aff)}</span>
          <span class="price">${escapeHTML(a.price)}</span>
        </div>
        <div class="ad-body">
          <h3>${escapeHTML(a.lieu)}</h3>
          <p class="muted">📍 ${escapeHTML(a.region)} • 📅 ${escapeHTML(a.dates)}</p>
          <p class="desc">${escapeHTML(a.desc)}</p>
          <div class="facts">
            <p><strong>Participants :</strong> ${escapeHTML(a.adults)}</p>
            <p><strong>Enfants :</strong> ${escapeHTML(a.kids)}</p>
            <p><strong>Places restantes :</strong> ${escapeHTML(a.places)}</p>
            <p><strong>Prix :</strong> ${escapeHTML(a.price)}</p>
          </div>
          <button class="btn primary" type="button">Voir le séjour</button>
        </div>
      </article>
    `;
  }).join("");
}

function openDetail(id) {
  selected = ads.find(function(a) {
    return String(a.id) === String(id);
  });

  if (!selected) {
    showToast("Annonce introuvable");
    return;
  }

  byId("detailTitle").textContent = "Annonce de " + selected.pseudo;
  byId("detailImage").src = selected.img;
  byId("detailImage").alt = selected.region;
  byId("detailAff").textContent = "💕 " + selected.aff + " d’affinités";
  byId("detailPlace").textContent = selected.lieu + " — " + selected.region;
  byId("detailDesc").textContent = selected.desc;
  byId("detailFacts").innerHTML = `
    <p><strong>Lien du lieu :</strong> ${escapeHTML(selected.link)}</p>
    <p><strong>Participants déjà enregistrés :</strong> ${escapeHTML(selected.adults)}</p>
    <p><strong>Nombre d’enfant et âge :</strong> ${escapeHTML(selected.kids)}</p>
    <p><strong>Places restantes :</strong> ${escapeHTML(selected.places)}</p>
    <p><strong>Conditions d’hébergement :</strong> ${escapeHTML(selected.home)}</p>
    <p><strong>Prix / participation :</strong> ${escapeHTML(selected.price)}</p>
    <p><strong>Dates proposées :</strong> ${escapeHTML(selected.dates)}</p>
  `;

  openModal("detailModal");
}

function openMessage(mode) {
  if (!selected) {
    showToast("Sélectionne d’abord une annonce");
    return;
  }

  const pseudo = byId("pseudoInput")?.value || "Marie75";
  closeModal("detailModal");

  byId("messageTitle").textContent = mode === "interest"
    ? "Prendre contact avec la co-vacancière"
    : "Poser une question";

  byId("messageSubject").value = mode === "interest"
    ? `${pseudo} est intéressée pour vous accompagner en vacances !`
    : `${pseudo} veut vous poser une question`;

  byId("messageBody").value = mode === "interest"
    ? `Bonjour ${selected.pseudo},\n\nVotre annonce m’intéresse beaucoup. J’aimerais échanger avec vous pour voir si nos familles pourraient être compatibles pour ce séjour.\n\nÀ bientôt !`
    : `Bonjour ${selected.pseudo},\n\nJ’ai une question concernant votre annonce : `;

  openModal("messageModal");
}

async function loadAdsFromSupabase() {
  if (!db) return;

  const { data, error } = await db
    .from(TABLE_ANNONCES)
    .select("*")
    .limit(50);

  if (error) {
    console.warn("Chargement Supabase impossible :", error);
    return;
  }

  if (Array.isArray(data) && data.length > 0) {
    data.forEach(function(row, index) {
      const normalized = normalizeAnnonce(row, index);
      if (!ads.some(function(a) { return String(a.id) === String(normalized.id); })) {
        ads.unshift(normalized);
      }
    });
    renderAds();
  }
}

async function publierAnnonce() {
  const lien = byId("annonceLien")?.value.trim() || "Non renseigné";
  const region = byId("annonceRegion")?.value || "Autre";
  const participants = byId("annonceParticipants")?.value || "À préciser";
  const enfants = byId("annonceEnfants")?.value.trim() || "À préciser";
  const places = byId("annoncePlaces")?.value || "À discuter";
  const prixValue = byId("annoncePrix")?.value;
  const prix = prixValue === "" ? null : Number(prixValue);
  const description = byId("annonceDescription")?.value.trim() || "";

  if (!description || description.length < 8) {
    showToast("Ajoute une description un peu plus complète");
    return;
  }

  if (prix !== null && Number.isNaN(prix)) {
    showToast("Le prix doit être un nombre");
    return;
  }

  if (!db) {
    console.error("Supabase non initialisé");
    showToast("Supabase non chargé");
    return;
  }

  const nouvelleAnnonce = {
    lien: lien,
    region: region,
    participants: participants,
    enfants: enfants,
    places: places,
    prix: prix,
    description: description
  };

  console.log("Annonce envoyée à Supabase :", nouvelleAnnonce);

  const { data, error } = await db
    .from(TABLE_ANNONCES)
    .insert([nouvelleAnnonce])
    .select();

  if (error) {
    console.error("Erreur Supabase complète :", JSON.stringify(error, null, 2));
    showToast("Erreur lors de la publication");
    return;
  }

  console.log("Annonce enregistrée :", data);

  const annonceLocale = normalizeAnnonce({
    ...nouvelleAnnonce,
    id: data?.[0]?.id || Date.now(),
    pseudo: byId("pseudoInput")?.value || "Parent solo",
    lieu: region,
    dates: "Dates à préciser",
    img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80",
    aff: "Nouveau",
    hebergement: description
  });

  ads.unshift(annonceLocale);
  renderAds();

  showToast("Annonce publiée ✅");
  closeModal("proposeModal");

  byId("annonceLien").value = "";
  byId("annonceEnfants").value = "";
  byId("annoncePrix").value = "";
  byId("annonceDescription").value = "";
}

window.openModal = openModal;
window.closeModal = closeModal;
window.openDetail = openDetail;
window.openMessage = openMessage;
window.showToast = showToast;
window.publierAnnonce = publierAnnonce;

window.addEventListener("DOMContentLoaded", function() {
  renderAds();

  document.querySelectorAll(".modal").forEach(function(modal) {
    modal.addEventListener("click", function(event) {
      if (event.target === modal) {
        modal.classList.remove("open");
      }
    });
  });

  loadAdsFromSupabase();
});
</script>
