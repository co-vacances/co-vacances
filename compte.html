<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mon compte - Co‑Vacances</title>

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#FFFDF8;
  color:#1E293B;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

.header{
  background:white;
  border-bottom:1px solid #E2E8F0;
  padding:20px;
}

.header h1{
  margin:0;
  color:#3BAFDA;
}

.layout{
  display:grid;
  grid-template-columns:250px 1fr;
  gap:30px;
  margin-top:30px;
}

.menu{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.menu a{
  display:block;
  padding:12px;
  color:#1E293B;
  text-decoration:none;
  font-weight:bold;
}

.menu a:hover{
  color:#3BAFDA;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:25px;
}

h2{
  margin-top:0;
}

.form-field{
  margin-bottom:15px;
}

.form-field label{
  display:block;
  margin-bottom:5px;
  font-weight:bold;
}

.form-field input,
.form-field textarea{
  width:100%;
  padding:12px;
  border:1px solid #E2E8F0;
  border-radius:10px;
}

.avatar-list{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.avatar{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#E8F8FC;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  cursor:pointer;
}

.btn{
  background:#3BAFDA;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:12px;
  cursor:pointer;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:12px;
  border-bottom:1px solid #E2E8F0;
}

.action{
  cursor:pointer;
  margin-right:10px;
}

.status-active{
  color:green;
  font-weight:bold;
}

.status-pause{
  color:orange;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="header">
    <div class="container">
        <h1>👤 Mon compte
